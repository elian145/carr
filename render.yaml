# Render Blueprint: use this when creating or updating the web service from the repo.
# See: https://render.com/docs/blueprint-spec
#
# Required: In Render Dashboard → Service → Environment, set:
#   APP_ENV=production
#   SECRET_KEY=<long random string, e.g. openssl rand -hex 32>
#   JWT_SECRET_KEY=<long random string>
#   DATABASE_URL=<postgresql://...>  (Render Postgres or another persistent PostgreSQL database)
#
# Universal / App Links (listing shares → open app):
#   APPLE_TEAM_ID=<10-char Team ID>
#   ANDROID_SHA256_CERT_FINGERPRINTS=<sha256>[,<sha256>...]
#     Local upload keystore example (add Play App Signing SHA after first Play upload):
#     9E:7A:AC:CF:0B:CE:7E:A3:0E:B9:9D:AF:DF:37:8E:1D:3E:6C:F6:C5:E8:C8:22:41:1E:53:F5:A5:72:40:97:E8
#
# Listing moderation (default: pending in production when unset):
#   LISTING_REQUIRE_APPROVAL=1
#   LISTING_REQUIRE_APPROVAL=0   # auto-publish (explicit)
#
# Also provision separately in the Render dashboard (not in this minimal blueprint):
#   - Redis instance → set REDIS_URL on the web service (required at boot)
#   - Background Worker running: celery -A kk.tasks.celery_app.celery_app worker --loglevel=info
#   - Background Worker/cron for beat if you use scheduled notifications:
#       celery -A kk.tasks.celery_app.celery_app beat --loglevel=info
#
# Admin dashboard (admin-web): second web service below (carr-admin).
# On the carr-admin service set JWT_SECRET_KEY to the SAME value as the API (carr).
#
# Force-update (optional; also editable in admin Settings):
#   MIN_APP_VERSION=1.0.1
#   MIN_ANDROID_BUILD=4
#   MIN_IOS_BUILD=4
services:
  - type: web
    runtime: python
    name: carr
    # Inline command avoids Windows CRLF in .sh files breaking `bash build_render.sh` on Linux (exit 1, no logs).
    # If the dashboard overrides Build Command, paste this same line there.
    buildCommand: echo "=== pip upgrade ===" && pip install --upgrade pip setuptools wheel && echo "=== pip install ===" && pip install --no-cache-dir -r kk/requirements.txt && echo "=== build OK ==="
    startCommand: bash start_render.sh
    healthCheckPath: /health
    envVars:
      # Non-secret; sync:false so dashboard can append Play App Signing SHA later.
      - key: ANDROID_SHA256_CERT_FINGERPRINTS
        value: "9E:7A:AC:CF:0B:CE:7E:A3:0E:B9:9D:AF:DF:37:8E:1D:3E:6C:F6:C5:E8:C8:22:41:1E:53:F5:A5:72:40:97:E8"
        sync: false

  # Browser admin dashboard (Next.js). Proxies API calls to the carr service.
  - type: web
    runtime: node
    name: carr-admin
    rootDir: admin-web
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Baked into the client bundle at build time; server proxy uses the same value.
      - key: NEXT_PUBLIC_API_BASE
        fromService:
          type: web
          name: carr
          envVarKey: RENDER_EXTERNAL_URL
      # Required in production — copy the same secret from the carr service (cannot auto-sync secrets).
      - key: JWT_SECRET_KEY
        sync: false
