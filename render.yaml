# Render Blueprint: use this when creating or updating the web service from the repo.
# See: https://render.com/docs/blueprint-spec
#
# Required: In Render Dashboard → Service → Environment, set:
#   APP_ENV=production
#   SECRET_KEY=<long random string, e.g. openssl rand -hex 32>
#   JWT_SECRET_KEY=<long random string>
#   DATABASE_URL=<postgresql://...>  (Render Postgres or another persistent PostgreSQL database)
#
# Universal / App Links (listing shares → open app):
#   APPLE_TEAM_ID=<10-char Team ID>
#   ANDROID_SHA256_CERT_FINGERPRINTS=<sha256>[,<sha256>...]
#     Dashboard-managed (sync:false below) -- the live value is NOT stored in this
#     file, so a Blueprint sync can never overwrite it. Production value for
#     package com.carnetiq.app (comma-separated, no spaces):
#       Google Play App Signing certificate (required for Play-installed builds):
#         3A:5B:6A:0A:66:8E:EE:68:14:4B:BB:B3:E8:29:49:1F:3F:55:2B:0A:7A:AF:E0:75:C4:CC:3E:8C:E3:60:36:82
#       Local/upload release keystore (directly installed locally-signed builds):
#         CD:C1:2F:74:DD:C0:E3:53:F1:61:14:D2:E3:66:CA:5A:71:34:E2:1F:49:23:89:95:4F:B1:39:45:8E:DB:52:9A
#     See docs/ANDROID_APP_LINKS_SETUP.md.
#
# Listing moderation (default: pending in production when unset):
#   LISTING_REQUIRE_APPROVAL=1
#   LISTING_REQUIRE_APPROVAL=0   # auto-publish (explicit)
#
# Google Play reviewer login (optional; off unless all three are set).
# Lets the Play reviewer sign in with a fixed phone/OTP pair that never
# expires and never sends a real SMS -- ONLY for the exact phone number
# below, gated behind the enable flag. See kk/routes/auth.py
# (_is_google_review_phone/_google_review_otp_matches) for the full design.
# Set these as Render dashboard secrets (sync:false) -- never commit real
# values to this file or anywhere else in the repo:
#   GOOGLE_REVIEW_LOGIN_ENABLED=1
#   GOOGLE_REVIEW_PHONE=<EXACTLY the 10 digits the reviewer will type into
#     the app's phone field -- NO leading 0, NO +964, e.g. 7999999999.
#     IMPORTANT: the mobile login screen always sends "+964" + those 10
#     digits, and the backend strips the "964" back off before comparing
#     (kk/routes/auth.py::_normalize_phone). If you enter the "0XXXXXXXXXX"
#     local format instead (11 digits, leading 0 -- e.g. what you'd see on
#     a SIM card), it will NEVER equal what the app actually sends, and the
#     bypass will silently never trigger for that reviewer.
#   GOOGLE_REVIEW_OTP=<a random 6-digit code, e.g. from: python -c "import secrets;print(f'{secrets.randbelow(1_000_000):06d}')">
#
# Also provision separately in the Render dashboard (not in this minimal blueprint):
#   - Redis instance → set REDIS_URL on the web service (required at boot)
#   - Background Worker running: celery -A kk.tasks.celery_app.celery_app worker --loglevel=info --concurrency=2 --max-tasks-per-child=50 --max-memory-per-child=200000
#     (BE-13: explicit concurrency/recycling for 512 MB instances; see carr-worker below.)
#   - Background Worker/cron for beat if you use scheduled notifications:
#       celery -A kk.tasks.celery_app.celery_app beat --loglevel=info
#
# Admin dashboard (admin-web): second web service below (carr-admin).
# On the carr-admin service set JWT_SECRET_KEY to the SAME value as the API (carr).
#
# Force-update (optional; also editable in admin Settings):
#   MIN_APP_VERSION=1.0.1
#   MIN_ANDROID_BUILD=4
#   MIN_IOS_BUILD=4
services:
  - type: web
    runtime: python
    name: carr
    # Inline command avoids Windows CRLF in .sh files breaking `bash build_render.sh` on Linux (exit 1, no logs).
    # If the dashboard overrides Build Command, paste this same line there.
    buildCommand: echo "=== pip upgrade ===" && pip install --upgrade pip setuptools wheel && echo "=== pip install ===" && pip install --no-cache-dir -r kk/requirements.txt && echo "=== build OK ==="
    startCommand: bash start_render.sh
    healthCheckPath: /health
    envVars:
      # Non-secret, but dashboard-managed (sync:false): the value is set in the
      # Render dashboard and a Blueprint sync must never overwrite it. Do not
      # put a literal value back here (a literal previously reverted the live
      # App Links fingerprints on sync). Required fingerprints are listed in
      # the header comment above and docs/ANDROID_APP_LINKS_SETUP.md.
      - key: ANDROID_SHA256_CERT_FINGERPRINTS
        sync: false

  # Browser admin dashboard (Next.js). Proxies API calls to the carr service.
  - type: web
    runtime: node
    name: carr-admin
    rootDir: admin-web
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Baked into the client bundle at build time; server proxy uses the same value.
      - key: NEXT_PUBLIC_API_BASE
        fromService:
          type: web
          name: carr
          envVarKey: RENDER_EXTERNAL_URL
      # Required in production — copy the same secret from the carr service (cannot auto-sync secrets).
      - key: JWT_SECRET_KEY
        sync: false

  # Celery worker, Frankfurt (BE-13 region fix). carr-redis lives in Frankfurt;
  # Render's internal Key Value/Redis hostname is only reachable from services
  # in the SAME region, so the Oregon-region carr-worker above cannot resolve
  # it. Region is immutable on an existing Render service, so this is a NEW
  # service (not an in-place edit of carr-worker) pinned to region: frankfurt.
  # Identical to carr-worker in every other respect (build/start command, env
  # var keys). Deploy this, copy the sync:false secret VALUES into it via the
  # Render Dashboard (not auto-synced from carr-worker), verify it connects to
  # carr-redis and processes a real task, THEN delete the old carr-worker
  # service in the Dashboard -- removing its block from this file does not
  # delete it automatically. Do not run both against production long-term
  # (duplicate task processing).
  - type: worker
    runtime: python
    name: carr-worker-fra
    region: frankfurt
    numInstances: 1
    # Operational hardening: static-ffmpeg==3.0 (kk/requirements.txt) does NOT
    # download its ffmpeg/ffprobe binaries at pip-install time or at bare
    # `import static_ffmpeg` time -- only on the FIRST call to
    # get_or_fetch_platform_executables_else_raise() (verified via a real
    # Linux/WSL run: ~15s, ~188 MiB each for ffmpeg/ffprobe). Without this
    # build-time step, that download would happen unexpectedly during the
    # FIRST real video-transcode Celery task in production. This calls the
    # SAME kk.video_transcoding.resolve_ffmpeg_paths() production code path
    # (respecting FFMPEG_PATH/FFPROBE_PATH overrides) during build, so the
    # binaries are already cached on disk before the worker ever starts.
    # Deliberately does NOT run a transcode -- only proves both executables
    # exist on disk after resolution. Any resolution failure (missing
    # static-ffmpeg, unsupported platform, network failure fetching the
    # binaries, etc.) raises FfmpegUnavailableError, which is an unhandled
    # Python exception here -- exits non-zero -- and, chained with `&&`,
    # fails the whole buildCommand (Render will not deploy a build that
    # failed). Worker-only: the web service (carr) never imports
    # kk.video_transcoding directly (it only enqueues the Celery task via
    # kk.routes.media), so it does not need this step.
    buildCommand: echo "=== pip upgrade ===" && pip install --upgrade pip setuptools wheel && echo "=== pip install ===" && pip install --no-cache-dir -r kk/requirements.txt && echo "=== ffmpeg prefetch (static-ffmpeg) ===" && python -c "import os, kk.video_transcoding as vt; ffmpeg_path, ffprobe_path = vt.resolve_ffmpeg_paths(); assert os.path.isfile(ffmpeg_path), 'ffmpeg missing after resolve -- ' + ffmpeg_path; assert os.path.isfile(ffprobe_path), 'ffprobe missing after resolve -- ' + ffprobe_path; print('ffmpeg prefetch OK', ffmpeg_path); print('ffprobe prefetch OK', ffprobe_path)" && echo "=== build OK ==="
    startCommand: celery -A kk.tasks.celery_app.celery_app worker --loglevel=info --concurrency=1 --max-tasks-per-child=50 --max-memory-per-child=200000
    envVars:
      - key: APP_ENV
        value: production
      # Copy the SAME values as the carr service (cannot auto-sync secrets).
      - key: SECRET_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      - key: R2_CHAT_BUCKET_NAME
        sync: false
      - key: R2_CHAT_ACCESS_KEY_ID
        sync: false
      - key: R2_CHAT_SECRET_ACCESS_KEY
        sync: false

  # Celery beat, Frankfurt (BE-13 region fix). Same reasoning as carr-worker-fra
  # above: carr-redis is in Frankfurt, and Render's internal Redis hostname is
  # only reachable within the same region, so the Oregon-region carr-beat
  # above cannot resolve it (meaning process_due_scheduled_notifications is
  # likely never actually being enqueued in production today). Region is
  # immutable on an existing service, so this is a NEW service, not an
  # in-place edit of carr-beat. Identical to carr-beat otherwise. Deploy,
  # copy the REDIS_URL secret value into it via the Render Dashboard, verify
  # it publishes the periodic schedule, THEN delete the old carr-beat service
  # in the Dashboard. MUST remain exactly one Frankfurt beat instance once
  # cut over — never run carr-beat and carr-beat-fra as beat schedulers at the
  # same time long-term (a second beat instance double-enqueues the schedule).
  - type: worker
    runtime: python
    name: carr-beat-fra
    region: frankfurt
    numInstances: 1
    buildCommand: echo "=== pip upgrade ===" && pip install --upgrade pip setuptools wheel && echo "=== pip install ===" && pip install --no-cache-dir -r kk/requirements.txt && echo "=== build OK ==="
    startCommand: celery -A kk.tasks.celery_app.celery_app beat --loglevel=info
    envVars:
      - key: APP_ENV
        value: production
      # Copy the SAME value as the carr service (cannot auto-sync secrets).
      - key: REDIS_URL
        sync: false
