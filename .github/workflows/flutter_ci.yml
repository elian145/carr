name: Flutter CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"

      - name: Flutter version
        run: flutter --version

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.config/dart
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      # lib/l10n/app_localizations*.dart are committed: fail if they drift from
      # the .arb files (stale generated code would ship missing/old strings).
      - name: Localization generated files are up to date
        run: |
          flutter gen-l10n
          git diff --exit-code -- lib/l10n

      # Static only. The deployed-host smoke test lives in verify_production.yml;
      # a `host check || static check` fallback here could never fail on the host
      # (false green) and made PR CI depend on the Render free-tier being awake.
      - name: Publish preflight (static)
        run: python scripts/verify_preflight.py --skip-host

      - name: Run tests
        run: bash scripts/flutter_test_ci.sh --no-pub --coverage

      - name: Build APK (debug, dev flavor)
        run: flutter build apk --debug --no-pub --flavor dev

  integration:
    name: Integration smoke (Android emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Integration smoke on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash scripts/flutter_integration_ci.sh --no-pub

